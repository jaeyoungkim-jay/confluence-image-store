name: sync
on:
  schedule:
    - cron: "30 21 * * 4"
  workflow_dispatch:
    inputs:
      days:
        description: "days back"
        default: "10"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sync_confluence_images.py
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          IMG_KEY: ${{ secrets.IMG_KEY }}
          DAYS: ${{ github.event.inputs.days || '10' }}
      - name: commit
        if: always()
        run: |
          git config user.name "image-sync"
          git config user.email "image-sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "sync" && git pull --rebase -q; git push)
